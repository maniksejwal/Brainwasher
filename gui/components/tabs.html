<!-- Admin Tabs Section -->
<div class="admin-tabs">
    <button class="tab active" data-tab="my-feedback">My Feedback</button>
    <button class="tab" data-tab="conversations">Conversations</button>
    <button class="tab" data-tab="simulations">Simulations</button>
    <button class="tab" data-tab="analysis">Analysis</button>
    <button class="tab" data-tab="logs">Server Logs</button>
</div>

<!-- Tab Contents -->
<div id="my-feedback" class="tab-content active scrollable-content"></div>

<div id="conversations" class="tab-content scrollable-content">
    <div id="conversations-list"></div>
</div>

<div id="simulations" class="tab-content scrollable-content">
    <div style="margin-bottom: 16px; padding: 12px; background: var(--gray-50); border-radius: 8px;">
        <h4 style="margin: 0 0 8px 0;">📚 How Simulations Work</h4>
        <p style="font-size: 13px; color: var(--gray-700); margin: 0;">
            Simulations create synthetic users with realistic personas and run conversations to test the AI agent. 
            Each simulation automatically generates feedback on response quality, escalation handling, and empathy. 
            View results in the "My Feedback" tab.
        </p>
    </div>
    
    <div style="margin-bottom: 16px;">
        <label style="display: block; margin-bottom: 4px; font-weight: 500;">Scenario Type:</label>
        <select id="scenario-select" style="width: 100%; padding: 8px; border: 1px solid var(--gray-300); border-radius: 4px;">
            <option value="">Loading scenarios...</option>
        </select>
    </div>
    
    <div style="margin-bottom: 16px;">
        <label style="display: block; margin-bottom: 4px; font-weight: 500;">
            Conversation Length:
            <span style="font-size: 12px; color: var(--gray-600); font-weight: normal; margin-left: 8px;">
                💡 Leave as "Random" for automatic permutations
            </span>
        </label>
        <select id="turns-select" style="width: 100%; padding: 8px; border: 1px solid var(--gray-300); border-radius: 4px;">
            <option value="random">🎲 Random (3-20 turns)</option>
            <option value="3">3 turns (Quick test ~ 2 min)</option>
            <option value="5">5 turns (Standard ~ 5 min)</option>
            <option value="10">10 turns (Deep dive ~ 10 min)</option>
            <option value="15">15 turns (Extended ~ 15 min)</option>
            <option value="20">20 turns (Full scenario ~ 20 min)</option>
        </select>
    </div>
    
    <button id="run-simulation" class="primary" style="width: 100%;">🔬 Run Simulation</button>
    <div id="simulation-results" style="margin-top: 16px;"></div>
    
    <div id="simulation-summary" style="display: none; margin-top: 16px; padding: 16px; background: var(--gray-50); border-radius: 8px;">
        <h4 style="margin: 0 0 12px 0;">📊 Simulation Complete</h4>
        <div id="simulation-stats"></div>
        <button id="view-feedback-btn" class="secondary" style="margin-top: 12px; width: 100%;">
            📋 View Detailed Feedback & Analysis
        </button>
    </div>
</div>

<div id="analysis" class="tab-content scrollable-content">
    <button id="generate-analysis" class="primary">Generate Analysis</button>
    <div id="analysis-results"></div>
</div>

<div id="logs" class="tab-content scrollable-content">
    <button id="refresh-logs" class="secondary">Refresh</button>
    <div id="logs-container" style="font-family: monospace; font-size: 12px; background: #f5f5f5; padding: 16px; border-radius: 4px; max-height: 500px; overflow-y: auto;"></div>
</div>
