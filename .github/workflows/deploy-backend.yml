name: Deploy Backend to ECS

on:
  push:
    branches:
      - main
    paths:
      - 'server.js'
      - 'package.json'
      - 'Dockerfile'
      - 'infrastructure.yaml'
      - 'routes/**'
      - 'handlers/**'
      - 'db/**'
      - 'middleware/**'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: brainwasher3-repo
  ECS_SERVICE: production-service
  ECS_CLUSTER: production-cluster
  ECS_TASK_DEFINITION: production-task
  CONTAINER_NAME: app

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy Infrastructure (CloudFormation)
        # Optional: Update infrastructure on push
        run: |
          aws cloudformation deploy \
            --template-file infrastructure.yaml \
            --stack-name Brainwasher3-Stack \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides EnvironmentName=production  \
            --no-fail-on-empty-changeset

      - name: Update ECS Service
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --force-new-deployment
