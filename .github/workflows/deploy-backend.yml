name: Deploy Backend to ECS

on:
  push:
    branches:
      - research
    paths:
      - 'server.js'
      - 'package.json'
      - 'Dockerfile'
      - 'deploy/infrastructure.yaml'
      - 'routes/**'
      - 'handlers/**'
      - 'db/**'
      - 'middleware/**'
      - '.github/workflows/deploy-backend.yml'

env:
  AWS_REGION: ap-south-1
  # Must match the repository created by deploy/infrastructure.yaml
  ECR_REPOSITORY: research-repo
  ECS_SERVICE: research-service
  ECS_CLUSTER: research-cluster
  CONTAINER_NAME: app
  STACK_NAME: Brainwasher3-Stack
  IMAGE_TAG: latest

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .
          docker tag  $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Deploy Infrastructure (CloudFormation)
        # Optional: Update infrastructure on push
        continue-on-error: true
        run: |
          aws cloudformation deploy \
            --template-file deploy/infrastructure.yaml \
            --stack-name $STACK_NAME \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides EnvironmentName=research ProjectName=yourbhai Llama4EndpointName=emm-llama4-dev EcsDesiredCount=0 \
            --no-fail-on-empty-changeset

      - name: Update ECS Service
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --desired-count 1 --force-new-deployment
